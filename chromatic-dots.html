<!doctype html>
<!-- AI tool: OpenAI ChatGPT. Source: user-specified red dot network pattern. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Connections</title>
<style>
:root{color-scheme:light;--background:#fff;--red:#ed2024}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--background)}
canvas{display:block;width:100%;height:100svh}
</style>
</head>
<body>
<canvas aria-label="무작위로 고르게 배치한 100개의 빨간 점과 점들을 연결하는 빨간 선">빨간 점 100개가 무작위로 빨간 선으로 연결된 네트워크입니다.</canvas>
<script>
const canvas=document.querySelector('canvas');
const ctx=canvas.getContext('2d');
const COUNT=100, RADIUS=10;
// Best-candidate sampling avoids clusters without imposing a visible grid.
const points=[];
for(let i=0;i<COUNT;i++){
  let best,score=-1;
  for(let k=0;k<100;k++){
    const p={x:Math.random(),y:Math.random()};
    const distance=points.length?Math.min(...points.map(q=>(p.x-q.x)**2+(p.y-q.y)**2)):1;
    if(distance>score){best=p;score=distance;}
  }
  points.push(best);
}
// Every point connects to two random, distinct other points. No self/duplicate edges.
const edges=new Set();
for(let i=0;i<COUNT;i++){
  const targets=new Set();
  while(targets.size<2){const j=Math.floor(Math.random()*COUNT);if(j!==i)targets.add(j);}
  for(const j of targets)edges.add([Math.min(i,j),Math.max(i,j)].join(','));
}
function draw(){
  const width=window.innerWidth,height=window.innerHeight,dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);
  const margin=24;
  const mapped=points.map(p=>({x:margin+p.x*Math.max(0,width-2*margin),y:margin+p.y*Math.max(0,height-2*margin)}));
  const red=getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
  ctx.strokeStyle=red;ctx.lineWidth=1;ctx.beginPath();
  for(const edge of edges){const [a,b]=edge.split(',').map(Number);ctx.moveTo(mapped[a].x,mapped[a].y);ctx.lineTo(mapped[b].x,mapped[b].y);}
  ctx.stroke();ctx.fillStyle=red;
  for(const p of mapped){ctx.beginPath();ctx.arc(p.x,p.y,RADIUS,0,Math.PI*2);ctx.fill();}
}
window.addEventListener('resize',draw);draw();
</script>
</body>
</html>
